<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo + Helpdesk - Admin Paneli</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Yönetim Paneli</div>
    <nav>
      <span id="whoami" class="muted"></span>
      <span id="roleBadge"></span>
      <a href="dashboard.html">Görevlerim</a>
      <button class="link" id="logoutBtn">Çıkış</button>
    </nav>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <button id="tabUsers" class="nav-item active" type="button">Kullanıcılar</button>
      <button id="tabTodos" class="nav-item" type="button">Tüm Todo'lar</button>
      <button id="tabDepartments" class="nav-item" type="button">Departmanlar</button>
      <button id="tabTickets" class="nav-item" type="button">Helpdesk Talepleri</button>
    </aside>

    <main class="content">
      <section id="panelUsers" class="card">
        <h2>Kullanıcılar</h2>
        <p id="usersError" class="error hidden"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Kullanıcı adı</th><th>Rol</th><th>Departman</th><th>Kayıt tarihi</th><th>İşlemler</th></tr></thead>
            <tbody id="usersList"></tbody>
          </table>
        </div>
      </section>

      <section id="panelTodos" class="card hidden">
        <h2>Tüm Todo'lar</h2>
        <p id="todosError" class="error hidden"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Sahibi</th><th>Başlık</th><th>Açıklama</th><th>Durum</th><th>İşlemler</th></tr></thead>
            <tbody id="adminTodosList"></tbody>
          </table>
        </div>
      </section>

      <section id="panelDepartments" class="card hidden">
        <h2>Departmanlar</h2>
        <form id="departmentForm" class="inline">
          <input id="departmentName" placeholder="Yeni departman adı" required />
          <button type="submit">Ekle</button>
        </form>
        <p id="departmentsError" class="error hidden"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Ad</th><th>Slug</th><th>İşlemler</th></tr></thead>
            <tbody id="departmentsList"></tbody>
          </table>
        </div>
      </section>

      <section id="panelTickets" class="card hidden">
        <h2>Helpdesk Talepleri</h2>
        <p id="ticketsError" class="error hidden"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Gönderen</th><th>Konu</th><th>Mesaj</th><th>Durum</th><th>Yanıt / Güncelle</th><th></th></tr></thead>
            <tbody id="adminTicketsList"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
